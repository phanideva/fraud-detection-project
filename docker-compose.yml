version: '3.8'

services:
  fraud-detection-api:
    build: 
      context: .
      dockerfile: deployment/Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - CONFIG_PATH=/app/config.yaml
    depends_on:
      - postgres_db

  postgres_db:
    image: postgres:14
    container_name: fraud-detection-db
    restart: always
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_password
      POSTGRES_DB: fraud_detection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
